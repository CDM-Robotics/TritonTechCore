}

javadoc {
  options {
    links 'https://docs.oracle.com/en/java/javase/17/docs/api/',
          'https://github.javadoc.io/allwpilib/docs/release/java/', 
          'https://codedocs.revrobotics.com/'
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.tritontech'
      artifactId = 'TritonTechCore'
      // version intentionally omitted: inherits project.version so the
      // published artifact can never drift from what generateVendorJson
      // and version.properties report.
      from components.java
    }
  }
  repositories {
    mavenLocal()  // Local publishing for testing
  }
}

// Bumps the PATCH digit of project.version in this file. CI owns the MINOR
// digit (bumped + reset PATCH to 0 on every push to main); this task lets you
// bump PATCH locally, with no network required, so publishToMavenLocal always
// produces a fresh version string and the consuming robot project actually
// re-resolves the dependency instead of reusing a cached jar. A version of
// X.Y.0 means "matches a commit CI has bumped on main"; X.Y.<non-zero> means
// "N local publishes since the last sync with main" -- pull before your first
// local bump of a session, or your local numbering can drift from main's.
task bumpPatchVersion {
    description 'Increments the PATCH version in build.gradle for local publishing'
    group 'Build'
    doLast {
        def buildFile = file('build.gradle')
        def text = buildFile.text
        def matcher = (text =~ /version = '(\d+)\.(\d+)\.(\d+)'/)
        if (!matcher.find()) {
            throw new GradleException("Could not find a version = 'X.Y.Z' line in build.gradle")
        }
        def major = matcher.group(1) as int
        def minor = matcher.group(2) as int
        def patch = matcher.group(3) as int
        def newVersion = "${major}.${minor}.${patch + 1}"
        buildFile.text = text.replaceFirst(/version = '\d+\.\d+\.\d+'/, "version = '${newVersion}'")
        println "Bumped version to ${newVersion}"
    }
}

// Task to clear build cache
task clearBuildCache(type: Delete) {
    description 'Clears the build cache to force dependency re-resolution'
    group 'Build'
    delete fileTree(dir: 'build/tmp/.cache')
}

// Task to generate TritonTechCore.json with dynamic user name and version
import groovy.json.JsonOutput
task generateVendorJson {
    description 'Generates TritonTechCore.json with dynamic user name and project version'
    group 'WPILib'

    doLast {
        def userName = System.getProperty('user.name')
        def json = [
            fileName: 'TritonTechCore.json',
            name: 'TritonTechCore',
            version: project.version,
            uuid: 'a121b32c-1adf-484c-bb57-0d959dbbe62f',
            frcYear: '2026',
            mavenUrls: ["file:///C:/Users/${userName}/.m2/repository/"],
            jsonUrl: "file:///C:/Users/${userName}/TritonTechCore/TritonTechCore.json",
            javaDependencies: [
                [
                    groupId: 'org.tritontech',
                    artifactId: 'TritonTechCore',
                    version: project.version
                ]
            ],
            jniDependencies: [],
            cppDependencies: []
        ]
        def jsonString = JsonOutput.prettyPrint(JsonOutput.toJson(json))
        file('TritonTechCore.json').text = jsonString
    }
}

// REMEMBER THIS COMMAND, it cleans up the vccode cache and project files!!!
// ./gradlew cleanEclipse eclipse

// Make publishToMavenLocal depend on generateVendorJson
publishToMavenLocal.dependsOn generateVendorJson
build.dependsOn generateVendorJson

// NOTE: bumpPatchVersion is deliberately NOT wired via dependsOn into
// publishToMavenLocal. Gradle's configuration phase (and the maven-publish
// plugin's publication coordinates) lock in project.version before any task
// runs, so a same-build file edit from bumpPatchVersion can't affect that
// same build's output -- it would only take effect on the *next* invocation,
// meaning this build still republishes under the old, already-used version.
// Run them as two separate commands instead, so the second one's
// configuration phase reads the freshly-bumped version off disk:
//   ./gradlew bumpPatchVersion
//   ./gradlew publishToMavenLocal
